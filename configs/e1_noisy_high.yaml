experiment_id: e1_noisy_high

data:
  dataset_name: squad
  dataset_split: validation
  max_questions_default: 300

retrieval:
  mode: single
  index_out: outputs/indexes/noisy_high_raw.faiss
  meta_out: outputs/indexes/noisy_high_raw_meta.jsonl
  embed_model: BAAI/bge-base-en-v1.5
  top_k: 5
  batch_size: 64

generation:
  model: google/flan-t5-base
  max_new_tokens: 32
  temperature: 0.0
  do_sample: false

eval:
  run_dir: outputs/runs/e1_noisy_high
  compute_retrieval_hit: true
  save_predictions: true
  seed: 42