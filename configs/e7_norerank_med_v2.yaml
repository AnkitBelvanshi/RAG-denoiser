experiment_id: e7_norerank_med_v2

data:
  dataset_name: squad
  dataset_split: validation
  max_questions_default: 300

retrieval:
  mode: dual_view
  embed_model: BAAI/bge-base-en-v1.5
  top_k: 5
  per_index_k: 30
  raw_index_out: outputs/indexes/med_v2_raw.faiss
  raw_meta_out: outputs/indexes/med_v2_raw_meta.jsonl
  norm_index_out: outputs/indexes/med_v2_norm.faiss
  norm_meta_out: outputs/indexes/med_v2_norm_meta.jsonl

rerank:
  enabled: false

denoise:
  enabled: true
  gated: true
  gate_threshold: 0.05
  gate_percentile: 90
  max_chunks: 1
  base_model: google/flan-t5-small
  adapter_path: outputs/models/denoiser_lora
  batch_size: 8
  device: cuda
  max_new_tokens: 32

generation:
  model: google/flan-t5-base
  max_new_tokens: 32
  temperature: 0.0
  do_sample: false

eval:
  run_dir: outputs/runs/e7_norerank_med_v2
  compute_retrieval_hit: true
  save_predictions: true
  seed: 42
