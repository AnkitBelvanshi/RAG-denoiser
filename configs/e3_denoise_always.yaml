experiment_id: e3_denoise_always

data:
  dataset_name: squad
  dataset_split: validation
  max_questions_default: 300

# retrieval:
#   mode: single
#   embed_model: BAAI/bge-base-en-v1.5
#   top_k: 5
#   index_out: outputs/indexes/e1_noisy_raw.faiss
#   meta_out: outputs/indexes/e1_noisy_raw_meta.jsonl

retrieval:
  mode: single
  embed_model: BAAI/bge-base-en-v1.5
  top_k: 5
  index_out: outputs/indexes/e1_noisy.faiss
  meta_out: outputs/indexes/e1_noisy_meta.jsonl

rerank:
  enabled: false

denoise:
  enabled: true
  base_model: google/flan-t5-small
  adapter_path: outputs/models/denoiser_lora
  batch_size: 8
  device: cuda
  max_new_tokens: 256

generation:
  model: google/flan-t5-base
  max_new_tokens: 32
  temperature: 0.0
  do_sample: false

eval:
  run_dir: outputs/runs/e3_denoise_always
  compute_retrieval_hit: true
  save_predictions: true
  seed: 42