experiment_id: e6_dual_view_rerank

data:
  dataset_name: squad
  dataset_split: validation
  max_questions_default: 300

retrieval:
  mode: dual_view
  embed_model: BAAI/bge-base-en-v1.5

  # This is the *candidate list size* the retriever will return.
  # For dual-view, make sure candidate_k <= 2 * per_index_k.
  top_k: 60
  per_index_k: 30

  raw_index_out: outputs/indexes/e1_noisy_raw.faiss
  raw_meta_out: outputs/indexes/e1_noisy_raw_meta.jsonl
  norm_index_out: outputs/indexes/e1_noisy_norm.faiss
  norm_meta_out: outputs/indexes/e1_noisy_norm_meta.jsonl

rerank:
  enabled: true
  model_name: BAAI/bge-reranker-base
  batch_size: 16
  candidate_k: 60
  top_n: 5
  device: auto

generation:
  model: google/flan-t5-base
  max_new_tokens: 32
  temperature: 0.0
  do_sample: false

eval:
  run_dir: outputs/runs/e6_dual_view_rerank
  compute_retrieval_hit: true
  save_predictions: true
  seed: 42