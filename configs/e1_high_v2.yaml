experiment_id: e1_noisy_high_v2

data:
  dataset_name: squad
  dataset_split: validation
  max_questions_default: 300

retrieval:
  mode: single
  embed_model: BAAI/bge-base-en-v1.5
  top_k: 5
  index_out: outputs/indexes/high_v2_raw.faiss
  meta_out: outputs/indexes/high_v2_raw_meta.jsonl

generation:
  model: google/flan-t5-base
  max_new_tokens: 32
  temperature: 0.0
  do_sample: false

eval:
  run_dir: outputs/runs/e1_noisy_high_v2
  compute_retrieval_hit: true
  save_predictions: true
  seed: 42
